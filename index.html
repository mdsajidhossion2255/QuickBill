<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16a34a">

    <title>QuickBill - Restaurant Billing Software</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">Quick<span>Bill</span></div>
        <p>Restaurant Billing Software</p>
    </header>

    <main class="container">

        <section class="welcome">
            <h1>স্বাগতম QuickBill-এ</h1>
            <p>আপনার রেস্টুরেন্টের বিল তৈরি ও হিসাব রাখুন সহজেই।</p>
        </section>

        <section class="dashboard">

            <div class="card">
                <h3>আজকের বিক্রি</h3>
                <h2>৳ 0.00</h2>
            </div>

            <div class="card">
                <h3>মোট বিল</h3>
                <h2>0</h2>
            </div>

            <div class="card">
                <h3>খাবারের আইটেম</h3>
                <h2>0</h2>
            </div>

        </section>

        <section class="menu">

            <h2>সফটওয়্যার মেনু</h2>

            <div class="menu-grid">

                <button>নতুন বিল তৈরি</button>

                <button>খাবারের তালিকা</button>

                <button>বিলের ইতিহাস</button>

                <button>দৈনিক রিপোর্ট</button>

                <button>রেস্টুরেন্ট সেটিংস</button>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 QuickBill. All Rights Reserved.</p>
    </footer>

</body>
</html>
